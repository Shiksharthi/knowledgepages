<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knowledge Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     EDITORIAL CORPORATE
     Warm stone paper · deep navy ink · steel blue · muted amber
     ============================================================ */
  :root {
    --paper:      #F4F2ED;
    --paper-alt:  #EDE9E1;
    --card:       #FFFFFF;

    --ink:        #13212D;
    --body:       #3C4A56;
    --muted:      #7B8894;
    --faint:      #A6AFB8;

    --line:       #E3DDD3;
    --line-soft:  #EFEBE3;

    --blue:       #2E5D7D;
    --blue-deep:  #1A3B52;
    --blue-soft:  #6D93AC;

    --amber:      #B5822F;
    --amber-tint: #F8F1E2;

    --r:  14px;
    --sh1: 0 1px 2px rgba(19,33,45,.04), 0 3px 10px rgba(19,33,45,.04);
    --sh2: 0 2px 6px rgba(19,33,45,.04), 0 12px 32px rgba(19,33,45,.07);

    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans:  "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

    --maxw: 940px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--body);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.65;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a { color: var(--blue); text-decoration: none; }
  a:hover { color: var(--blue-deep); }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

  /* ---------- Top bar ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(244,242,237,0.85);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 22px 28px;
    max-width: var(--maxw);
    margin: 0 auto;
  }
  .brand .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 5px var(--amber-tint);
    flex: none;
  }
  .brand h1 {
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
    margin: 0;
  }

  /* ---------- Page body ---------- */
  main { padding: clamp(52px, 9vw, 104px) 0 120px; }
  .panel { display: none; }
  .panel.active { display: block; animation: rise .5s cubic-bezier(.2,.7,.3,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 26px;
  }
  .eyebrow::after { content: ''; height: 1px; flex: 1; background: var(--line); }

  .hero h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(33px, 5.6vw, 58px);
    line-height: 1.08;
    letter-spacing: -0.022em;
    color: var(--ink);
    margin: 0 0 26px;
    max-width: 19ch;
  }
  .hero h2 em { font-style: italic; color: var(--blue); }

  .lede {
    font-size: 17px;
    line-height: 1.78;
    color: var(--muted);
    max-width: 58ch;
    margin: 0 0 clamp(40px, 7vw, 76px);
  }

  /* ---------- Directory cards ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 20px;
    counter-reset: card;
  }
  .card {
    counter-increment: card;
    position: relative;
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: var(--r);
    padding: 28px 28px 30px;
    box-shadow: var(--sh1);
    overflow: hidden;
    transition: transform .4s cubic-bezier(.2,.7,.3,1), box-shadow .4s, border-color .4s;
  }
  .card::before {
    content: counter(card, decimal-leading-zero);
    position: absolute;
    top: 27px; right: 26px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
  }
  .card::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--blue);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform .4s cubic-bezier(.2,.7,.3,1);
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--sh2);
    border-color: var(--line);
  }
  .card:hover::after { transform: scaleY(1); }

  .card .k {
    font-size: 10.5px;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 16px;
  }
  .card .v {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: -0.012em;
    margin: 0;
  }
  .card .v a {
    color: var(--ink);
    transition: color .3s;
  }
  /* link covers the whole card */
  .card .v a::before {
    content: '';
    position: absolute;
    inset: 0;
  }
  .card .v a::after {
    content: '\2192';
    font-family: var(--sans);
    font-weight: 400;
    font-size: 15px;
    color: var(--blue-soft);
    margin-left: 11px;
    display: inline-block;
    transition: transform .35s cubic-bezier(.2,.7,.3,1), color .3s;
  }
  .card:hover .v a { color: var(--blue); }
  .card:hover .v a::after { transform: translateX(6px); color: var(--blue); }

  @media (max-width: 620px) {
    .wrap { padding: 0 20px; }
    .brand { padding: 18px 20px; }
    .card { padding: 26px 22px; }
  }

  @media print {
    header { display: none !important; }
    body { background: #fff; }
    .panel { display: block !important; }
    .card { box-shadow: none; border-color: #ccc; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <h1>Knowledge Directory</h1>
    </div>
  </header>

  <main class="wrap">
    <section class="panel active" id="welcome">
      <div class="hero">
        <p class="eyebrow">Programs &amp; References</p>
        <h2>Working notes and reference guides<em>, in one place.</em></h2>
        <p class="lede">A small library of practical program-management material — written to be used at work rather than filed away.</p>

        <div class="grid">
          <div class="card">
            <p class="k">GDPR Data Cleanup</p>
            <h4 class="v"><a href="./DatacomplianceAndRemidiationPlan.html">GDPR compliance plan</a></h4>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
